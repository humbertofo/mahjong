<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Gradiente das pedras zen de equilíbrio -->
    <linearGradient id="stone-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="stone-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="stone-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Ondulação da água na base -->
  <path d="M10 42C16 40 32 40 38 42" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Pedra Grande Inferior (Jade Verde) -->
  <ellipse cx="24" cy="35" rx="14" ry="5.5" 
           fill="url(#stone-large)" stroke="#a7f3d0" stroke-width="1.8" />
  
  <!-- Pedra Média Central (Quartzo Azul) -->
  <ellipse cx="24" cy="25" rx="10" ry="4.5" 
           fill="url(#stone-med)" stroke="#bae6fd" stroke-width="1.8" />
  
  <!-- Pedra Superior Pequena (Âmbar Solar) -->
  <ellipse cx="24" cy="16" rx="6.5" ry="3.5" 
           fill="url(#stone-top)" stroke="#fef9c3" stroke-width="1.8" />
  
  <!-- Broto / Gota de orvalho no topo -->
  <circle cx="24" cy="8.5" r="2.2" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />
</svg>
