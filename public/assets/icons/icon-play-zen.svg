  </defs>

  <!-- Triângulo de Play com Relevo Zen -->
  <path d="M16 11C16 9.4 17.8 8.4 19.2 9.3L37.8 22.3C39 23.2 39 24.8 37.8 25.7L19.2 38.7C17.8 39.6 16 38.6 16 37V11Z" 
