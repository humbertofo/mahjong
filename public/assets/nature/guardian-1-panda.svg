<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <radialGradient id="g1-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="70%" stop-color="#143e26" />
      <stop offset="100%" stop-color="#081c10" />
    </radialGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7b1c" />
    </linearGradient>
  </defs>

  <!-- Medalhão Base -->
  <circle cx="70" cy="70" r="66" fill="url(#g1-bg)" stroke="url(#g-gold)" stroke-width="4" />
  <circle cx="70" cy="70" r="59" fill="none" stroke="url(#g-gold)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7" />

  <!-- Animal: Panda Zen Guardião da Lótus -->
  <g transform="translate(10, 8) scale(0.6)">
    <!-- Orelhas -->
    <circle cx="68" cy="62" r="18" fill="#1b1e22" />
    <circle cx="132" cy="62" r="18" fill="#1b1e22" />
    <!-- Cabeça -->
    <ellipse cx="100" cy="98" rx="46" ry="40" fill="#fdfbf7" stroke="#1b1e22" stroke-width="2.5" />
    <!-- Manchas dos olhos -->
    <ellipse cx="80" cy="96" rx="13" ry="11" fill="#1b1e22" transform="rotate(-15 80 96)" />
    <ellipse cx="120" cy="96" rx="13" ry="11" fill="#1b1e22" transform="rotate(15 120 96)" />
    <!-- Olhos brilhantes -->
    <circle cx="82" cy="95" r="5" fill="#fff" />
    <circle cx="82" cy="95" r="3" fill="#111" />
    <circle cx="118" cy="95" r="5" fill="#fff" />
    <circle cx="118" cy="95" r="3" fill="#111" />
    <!-- Bochechas -->
    <ellipse cx="68" cy="106" rx="6" ry="3.5" fill="#ff758f" opacity="0.6" />
    <ellipse cx="132" cy="106" rx="6" ry="3.5" fill="#ff758f" opacity="0.6" />
    <!-- Focinho -->
    <ellipse cx="100" cy="103" rx="6" ry="4" fill="#1b1e22" />
    <path d="M 96,108 Q 100,113 104,108" stroke="#1b1e22" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Flor de Lótus Sagrada -->
    <path d="M 100,56 C 88,48 84,32 100,24 C 116,32 112,48 100,56 Z" fill="#ff758f" />
    <circle cx="100" cy="46" r="3" fill="#ffd166" />
  </g>

  <!-- Ornato Floral Base -->
  <path d="M 50,118 C 62,112 78,112 90,118 C 82,126 58,126 50,118 Z" fill="url(#g-gold)" />
</svg>
