<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradiente da Pedra de Marfim/Jade -->
    <linearGradient id="tileBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gradiente da Borda Chanfrada Dourada -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Gradiente Dourado Nobre do Animal -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Gradiente Jade Zen para Detalhes Botânicos -->
    <linearGradient id="jadeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sombra Projetada da Pedra -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#02120b" flood-opacity="0.65" />
    </filter>

    <!-- Brilho Interno Chanfrado -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="80%" stop-color="#cbd5e1" stop-opacity="0" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base da Pedra de Mahjong com Relevo 3D -->
  <g filter="url(#tileShadow)">
    <!-- Base Dourada Externa -->
    <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#goldBorderGrad)" />
    <!-- Borda Interna Esculpida de Jade -->
    <rect x="11" y="11" width="98" height="98" rx="21" fill="#04261b" />
    <!-- Corpo de Marfim Nobre -->
    <rect x="14" y="14" width="92" height="92" rx="18" fill="url(#tileBodyGrad)" />
    <!-- Camada de Reflexo de Vidro/Cristal -->
    <rect x="14" y="14" width="92" height="92" rx="18" fill="url(#innerGlow)" />
  </g>

  <!-- Frisos de Canto Estilo Marfim Tradicional -->
  <g stroke="url(#goldBorderGrad)" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 22,30 Q 22,22 30,22" />
    <path d="M 98,30 Q 98,22 90,22" />
    <path d="M 22,90 Q 22,98 30,98" />
    <path d="M 98,90 Q 98,98 90,98" />
  </g>

  <!-- ════════ GLIFO CENTRAL: EMBLEMA DA PATA DO TIGRE/URSO & FLOR DE LÓTUS ════════ -->
  <!-- Almofada Central da Pata em Relevo Dourado Esculpido -->
  <g transform="translate(60, 64)">
    <!-- Almofada Principal (Forma de Coração Zen / Pata Majestosa) -->
    <path d="M 0,16 C -18,16 -24,4 -22,-6 C -20,-16 -8,-18 0,-9 C 8,-18 20,-16 22,-6 C 24,4 18,16 0,16 Z" 
          fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.2" />

    <!-- Dedo 1 (Esquerda) -->
    <ellipse cx="-20" cy="-21" rx="6.5" ry="9" transform="rotate(-26 -20 -21)" 
             fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.2" />

    <!-- Dedo 2 (Centro-Esquerda) -->
    <ellipse cx="-7" cy="-28" rx="7" ry="10" transform="rotate(-8 -7 -28)" 
             fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.2" />

    <!-- Dedo 3 (Centro-Direita) -->
    <ellipse cx="7" cy="-28" rx="7" ry="10" transform="rotate(8 7 -28)" 
             fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.2" />

    <!-- Dedo 4 (Direita) -->
    <ellipse cx="20" cy="-21" rx="6.5" ry="9" transform="rotate(26 20 -21)" 
             fill="url(#emblemGold)" stroke="#b45309" stroke-width="1.2" />

    <!-- Pétala de Flor de Lótus Inferior (Acento Zen em Jade) -->
    <path d="M 0,16 C -8,22 -14,24 -18,22 C -12,28 -5,30 0,31 C 5,30 12,28 18,22 C 14,24 8,22 0,16 Z"
          fill="url(#jadeAccent)" />

    <!-- Filete de Brilho Central Superior -->
    <ellipse cx="0" cy="-3" rx="10" ry="6" fill="#ffffff" opacity="0.45" />
    <circle cx="-6" cy="-28" r="2.5" fill="#ffffff" opacity="0.6" />
    <circle cx="6" cy="-28" r="2.5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Brilho Especular Superior Esquerdo -->
  <path d="M 22,24 C 28,18 40,16 52,16 C 36,18 26,26 22,38 Z" fill="#ffffff" opacity="0.75" />
</svg>
