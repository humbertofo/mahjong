name: 🚀 Compilar APK & Live Update (GitHub Actions)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: 📱 Gerar APK e Pacote Live Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📦 Instalar Dependências do Projeto
        run: npm ci

      - name: 🔨 Compilar Frontend (Vite + TypeScript)
        run: npm run build

      - name: 📦 Compactar Pacote Web para Live Update (dist.zip)
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      - name: 🔄 Sincronizar Assets com Capacitor Android
        run: npx cap sync android

      - name: 🛡️ Dar Permissão de Execução ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 📱 Compilar APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Organizar APKs de saída
        run: |
          mkdir -p output-apk
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y%m%d')
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Mahjong-Animal-${DATE}-${SHORT_SHA}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Mahjong-Animal-latest.apk

      - name: ☁️ Publicar APK como Artefato de Download (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-Animal-APK
          path: output-apk/*.apk
          retention-days: 30

      - name: 🌐 Atualizar Release de Live Update Silencioso
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-update
          name: "Live Update (Auto)"
          body: "Pacote de atualização remota OTA silenciosa e APK mais recente para o Mahjong."
          files: |
            dist.zip
            output-apk/Mahjong-Animal-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🌟 Criar GitHub Release Oficial (se for uma tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-apk/*.apk
            dist.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
